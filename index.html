<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule Submission Reminder</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; background: #f5f7fb; color: #222; }
  h1 { font-size: 1.4rem; }
  h3 { margin: 0 0 8px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  form { display: grid; gap: 10px; }
  label { display: grid; gap: 4px; font-size: .95rem; }
  input, select, button { padding: 10px; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; width: 100%; }
  button { cursor: pointer; background: #2563eb; color: #fff; border: none; }
  button.secondary { background: #6b7280; }
  button.danger { background: #dc2626; }
  button.success { background: #16a34a; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .row button { width: auto; flex: 1; }
  .item { border-bottom: 1px solid #eee; padding: 10px 0; }
  .item:last-child { border-bottom: none; }
  .done { text-decoration: line-through; color: #888; }
  .overdue { color: #dc2626; font-weight: 600; }
  .badge { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: #e5e7eb; margin-left: 4px; }
  .alert { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 8px; margin-bottom: 8px; border-radius: 6px; }
  .muted { color: #666; font-size: .9rem; }
</style>
</head>
<body>

<h1>📅 Schedule Submission Reminder</h1>

<div class="card">
  <button id="notifyBtn" class="secondary">Allow notifications</button>
  <div id="notifyStatus" class="muted" style="margin-top:6px"></div>
</div>

<div class="card">
  <h3>Pending now</h3>
  <div id="alerts"></div>
</div>

<div class="card">
  <h3>Add a schedule to submit</h3>
  <form id="form">
    <label>Schedule of work
      <input id="title" placeholder="e.g. Week 5 Lab Schedule" required>
    </label>
    <label>Submit by
      <input id="due" type="datetime-local" required>
    </label>
    <label>Remind me this many minutes before
      <input id="lead" type="number" min="0" value="60">
    </label>
    <label>Repeat
      <select id="repeat">
        <option value="none">Once</option>
        <option value="weekly">Every week</option>
      </select>
    </label>
    <button type="submit">Add reminder</button>
  </form>
</div>

<div class="card">
  <h3>All reminders</h3>
  <div id="list"></div>
</div>

<script>
  const KEY = "schedule-reminders-v1";
  const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
  const HOUR_MS = 60 * 60 * 1000;
  const NAG_COUNT = 24;               // reminders per deadline: one per hour, 24 hours
  const LN = window.Capacitor && window.Capacitor.Plugins
    ? window.Capacitor.Plugins.LocalNotifications : null;

  let items = JSON.parse(localStorage.getItem(KEY) || "[]");
  const notified = new Set();
  const $ = id => document.getElementById(id);

  function save() { localStorage.setItem(KEY, JSON.stringify(items)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function remindAt(it) { return new Date(it.due).getTime() - (Number(it.lead) || 0) * 60000; }
  function isOverdue(it) { return !it.submitted && new Date(it.due).getTime() < Date.now(); }

  // Native notification IDs must be integers, so turn each item id into a number
  function baseId(it) {
    let h = 0;
    for (const c of it.id) h = (h * 31 + c.charCodeAt(0)) | 0;
    return Math.abs(h) % 1000000;
  }
  function nativeIds(it) {
    const b = baseId(it) * NAG_COUNT;
    return Array.from({ length: NAG_COUNT }, (_, k) => b + k);
  }

  // ---------- Native (Android) notifications ----------
  async function cancelNative(it) {
    if (!LN) return;
    try {
      await LN.cancel({ notifications: nativeIds(it).map(id => ({ id })) });
    } catch (e) { /* nothing scheduled */ }
  }

  async function scheduleNative(it) {
    if (!LN || it.submitted) return;
    await cancelNative(it);
    const start = Math.max(remindAt(it), Date.now() + 5000);
    const ids = nativeIds(it);
    const list = ids.map((id, k) => ({
      id,
      title: "Submit: " + it.title,
      body: "Due " + new Date(it.due).toLocaleString(),
      schedule: { at: new Date(start + k * HOUR_MS), allowWhileIdle: true }
    }));
    try {
      await LN.schedule({ notifications: list });
    } catch (e) {
      console.error("Could not schedule notification", e);
    }
  }

  // ---------- Rendering ----------
  function renderAlerts() {
    const box = $("alerts");
    box.innerHTML = "";
    const now = Date.now();
    const active = items.filter(it => !it.submitted && now >= remindAt(it));
    if (!active.length) { box.textContent = "Nothing pending right now. ✅"; return; }
    active.forEach(it => {
      const div = document.createElement("div");
      div.className = "alert";
      div.textContent = `⏰ "${it.title}" — due ${new Date(it.due).toLocaleString()}` +
        (isOverdue(it) ? " (OVERDUE)" : "");
      box.appendChild(div);
    });
  }

  function render() {
    const list = $("list");
    list.innerHTML = "";
    if (!items.length) { list.textContent = "No reminders yet. Add one above."; return; }
    [...items].sort((a, b) => new Date(a.due) - new Date(b.due)).forEach(it => {
      const row = document.createElement("div");
      row.className = "item";

      const title = document.createElement("strong");
      title.textContent = it.title;
      if (it.submitted) title.className = "done";

      const meta = document.createElement("div");
      meta.className = "muted" + (isOverdue(it) ? " overdue" : "");
      meta.textContent = `Due: ${new Date(it.due).toLocaleString()}` +
        (isOverdue(it) ? " — OVERDUE" : "") + (it.submitted ? " — submitted" : "");

      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = it.repeat === "weekly" ? "Weekly" : "Once";

      const actions = document.createElement("div");
      actions.className = "row";

      const doneBtn = document.createElement("button");
      doneBtn.className = "success";
      doneBtn.textContent = it.repeat === "weekly" ? "Submitted (next week)" : "Mark submitted";
      doneBtn.onclick = () => markSubmitted(it.id);

      const delBtn = document.createElement("button");
      delBtn.className = "danger";
      delBtn.textContent = "Delete";
      delBtn.onclick = () => deleteItem(it.id);

      actions.append(doneBtn, delBtn);
      row.append(title, document.createElement("br"), meta, badge, actions);
      list.appendChild(row);
    });
  }

  // ---------- Actions ----------
  async function markSubmitted(id) {
    const it = items.find(x => x.id === id);
    if (!it) return;
    if (it.repeat === "weekly") {
      it.due = new Date(new Date(it.due).getTime() + WEEK_MS).toISOString();
      it.submitted = false;
      save();
      await scheduleNative(it);
    } else {
      it.submitted = true;
      save();
      await cancelNative(it);
    }
    render();
    renderAlerts();
  }

  async function deleteItem(id) {
    if (!confirm("Delete this reminder?")) return;
    const it = items.find(x => x.id === id);
    if (it) await cancelNative(it);
    items = items.filter(x => x.id !== id);
    save();
    render();
    renderAlerts();
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const it = {
      id: uid(),
      title: $("title").value.trim(),
      due: new Date($("due").value).toISOString(),
      lead: Number($("lead").value) || 0,
      repeat: $("repeat").value,
      submitted: false
    };
    items.push(it);
    save();
    e.target.reset();
    $("lead").value = 60;
    await scheduleNative(it);
    render();
    renderAlerts();
  });

  // ---------- Permissions ----------
  async function updateNotifyStatus() {
    if (LN) {
      const p = await LN.checkPermissions();
      $("notifyStatus").textContent = "Permission: " + p.display;
      return;
    }
    if (!("Notification" in window)) {
      $("notifyStatus").textContent = "Notifications not supported here.";
      $("notifyBtn").disabled = true;
      return;
    }
    $("notifyStatus").textContent = "Permission: " + Notification.permission;
  }

  $("notifyBtn").onclick = async () => {
    if (LN) await LN.requestPermissions();
    else if ("Notification" in window) await Notification.requestPermission();
    updateNotifyStatus();
  };

  // Browser fallback (only used when running in a web browser, not the Android app)
  function checkWebNotifications() {
    if (LN) return;
    const now = Date.now();
    items.forEach(it => {
      if (it.submitted) return;
      const key = it.id + "|" + it.due;
      if (now >= remindAt(it) && !notified.has(key)) {
        notified.add(key);
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("Submit: " + it.title, { body: "Due " + new Date(it.due).toLocaleString() });
        }
      }
    });
  }

  // ---------- Start ----------
  async function init() {
    await updateNotifyStatus();
    if (LN) {
      // Make sure every pending deadline has its notifications scheduled
      for (const it of items) await scheduleNative(it);
    }
    render();
    renderAlerts();
    checkWebNotifications();
    setInterval(() => { checkWebNotifications(); renderAlerts(); }, 30 * 1000);
  }
  init();
</script>
</body>
</html>
