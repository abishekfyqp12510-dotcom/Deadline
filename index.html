<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule Submission Reminder</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: #f5f7fb; color: #222; }
  h1 { font-size: 1.5rem; }
  h3 { margin-top: 0; }
  .card { background: #fff; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  form { display: grid; gap: .6rem; }
  label { display: grid; gap: .25rem; font-size: .95rem; }
  input, select, button { padding: .5rem; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc; }
  button { cursor: pointer; background: #2563eb; color: #fff; border: none; }
  button.secondary { background: #6b7280; }
  button.danger { background: #dc2626; }
  button.success { background: #16a34a; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 1px solid #eee; padding: .7rem 0; flex-wrap: wrap; }
  .item:last-child { border-bottom: none; }
  .info { flex: 1; min-width: 200px; }
  .actions { display: flex; gap: .4rem; }
  .overdue { color: #dc2626; font-weight: 600; }
  .done { text-decoration: line-through; color: #888; }
  .badge { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: #e5e7eb; margin-left: .3rem; }
  .alert { background: #fef3c7; border-left: 4px solid #f59e0b; padding: .6rem; margin-bottom: .5rem; border-radius: 6px; }
  .muted { color: #666; font-size: .9rem; }
</style>
</head>
<body>

<h1>📅 Schedule Submission Reminder</h1>

<div class="card">
  <button id="notifyBtn" class="secondary">Enable browser notifications</button>
  <span id="notifyStatus" class="muted"></span>
</div>

<div class="card">
  <h3>Pending reminders</h3>
  <div id="alerts"></div>
</div>

<div class="card">
  <h3>Add a schedule to submit</h3>
  <form id="form">
    <label>Schedule of work
      <input id="title" placeholder="e.g. Week 5 Lab Schedule" required>
    </label>
    <label>Submit by
      <input id="due" type="datetime-local" required>
    </label>
    <label>Remind me this many minutes before
      <input id="lead" type="number" min="0" value="60">
    </label>
    <label>Repeat
      <select id="repeat">
        <option value="none">Once</option>
        <option value="weekly">Every week</option>
      </select>
    </label>
    <button type="submit">Add reminder</button>
  </form>
</div>

<div class="card">
  <h3>All reminders</h3>
  <div id="list"></div>
</div>

<script>
  const KEY = "schedule-reminders-v1";
  const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
  let items = JSON.parse(localStorage.getItem(KEY) || "[]");
  const notified = new Set();

  const $ = id => document.getElementById(id);

  function save() {
    localStorage.setItem(KEY, JSON.stringify(items));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // Time at which the reminder should start showing
  function remindAt(it) {
    return new Date(it.due).getTime() - (Number(it.lead) || 0) * 60000;
  }

  function isOverdue(it) {
    return !it.submitted && new Date(it.due).getTime() < Date.now();
  }

  // ---------- Rendering ----------
  function renderAlerts() {
    const box = $("alerts");
    box.innerHTML = "";
    const now = Date.now();
    const active = items.filter(it => !it.submitted && now >= remindAt(it));
    if (!active.length) {
      box.textContent = "Nothing pending right now. ✅";
      return;
    }
    active.forEach(it => {
      const div = document.createElement("div");
      div.className = "alert";
      div.textContent = `⏰ "${it.title}" — due ${new Date(it.due).toLocaleString()}` +
        (isOverdue(it) ? " (OVERDUE)" : "");
      box.appendChild(div);
    });
  }

  function render() {
    const list = $("list");
    list.innerHTML = "";
    if (!items.length) {
      list.textContent = "No reminders yet. Add one above.";
      return;
    }
    [...items]
      .sort((a, b) => new Date(a.due) - new Date(b.due))
      .forEach(it => {
        const row = document.createElement("div");
        row.className = "item";

        const info = document.createElement("div");
        info.className = "info";

        const title = document.createElement("strong");
        title.textContent = it.title;
        if (it.submitted) title.className = "done";

        const meta = document.createElement("div");
        meta.className = "muted" + (isOverdue(it) ? " overdue" : "");
        meta.textContent = `Due: ${new Date(it.due).toLocaleString()}` +
          (isOverdue(it) ? " — OVERDUE" : "") +
          (it.submitted ? " — submitted" : "");

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = it.repeat === "weekly" ? "Weekly" : "Once";

        info.append(title, document.createElement("br"), meta, badge);

        const actions = document.createElement("div");
        actions.className = "actions";

        const doneBtn = document.createElement("button");
        doneBtn.className = "success";
        doneBtn.textContent = it.repeat === "weekly" ? "Submitted (next week)" : "Mark submitted";
        doneBtn.onclick = () => markSubmitted(it.id);

        const delBtn = document.createElement("button");
        delBtn.className = "danger";
        delBtn.textContent = "Delete";
        delBtn.onclick = () => deleteItem(it.id);

        actions.append(doneBtn, delBtn);
        row.append(info, actions);
        list.appendChild(row);
      });
  }

  // ---------- Actions ----------
  function markSubmitted(id) {
    const it = items.find(x => x.id === id);
    if (!it) return;
    if (it.repeat === "weekly") {
      // Move to the next week's deadline instead of finishing it
      it.due = new Date(new Date(it.due).getTime() + WEEK_MS).toISOString();
      it.submitted = false;
    } else {
      it.submitted = true;
    }
    save();
    render();
    renderAlerts();
  }

  function deleteItem(id) {
    if (!confirm("Delete this reminder?")) return;
    items = items.filter(x => x.id !== id);
    save();
    render();
    renderAlerts();
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    items.push({
      id: uid(),
      title: $("title").value.trim(),
      due: new Date($("due").value).toISOString(),
      lead: Number($("lead").value) || 0,
      repeat: $("repeat").value,
      submitted: false
    });
    save();
    e.target.reset();
    $("lead").value = 60;
    render();
    renderAlerts();
  });

  // ---------- Notifications ----------
  function updateNotifyStatus() {
    if (!("Notification" in window)) {
      $("notifyStatus").textContent = "Browser notifications not supported here.";
      $("notifyBtn").disabled = true;
      return;
    }
    $("notifyStatus").textContent = "Permission: " + Notification.permission;
  }

  $("notifyBtn").onclick = async () => {
    if (!("Notification" in window)) return;
    await Notification.requestPermission();
    updateNotifyStatus();
  };

  function checkReminders() {
    const now = Date.now();
    items.forEach(it => {
      if (it.submitted) return;
      const key = it.id + "|" + it.due; // one alert per deadline
      if (now >= remindAt(it) && !notified.has(key)) {
        notified.add(key);
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("Submit: " + it.title, {
            body: "Due " + new Date(it.due).toLocaleString()
          });
        }
      }
    });
    renderAlerts();
    render();
  }

  // ---------- Start ----------
  updateNotifyStatus();
  render();
  checkReminders();
  setInterval(checkReminders, 30 * 1000); // check every 30 seconds
</script>

</body>
</html>
